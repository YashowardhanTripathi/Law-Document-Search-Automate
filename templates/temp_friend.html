{% extends 'base.html' %}
{%block title%}{{title}} {%endblock%}
{% block content %}
  <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find IPC And BNS</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Enter IPC Code</h1>

    <form id="IPCCode">
        <input type = "text" placeholder="Enter IPC Code" name="IPCCode">
        <input type = "submit" value = "Find IPC Code" class = "btn btn-secondary">
    </form>
    <br/><br/>
    <li>Please input BNS Section Code</li>
    <br/>
    <form id="BNSCode">
      <input type = "text" placeholder="Enter BNS Code" name="BNSCode">
      <input type="submit" value = "Find BNS Code" class = "btn btn-secondary">
    </form>
    <br/><br/>
    <!-- Error pop-up element -->
    <div id="errorPopup" class="error-popup">Incorrect Input!</div>

    <script>
        // Handle form submission
        document.getElementById('IPCCode').addEventListener('submit', function(event) {
            event.preventDefault();  // Prevent form from submitting normally

            // Prepare form data
            let formData = new FormData(this);

            // Send a POST request to the /check-username endpoint
            fetch('/friend', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // If the response contains an error, show it in a pop-up
                if (data.error) {
                    Swal.fire({
                        title: 'Error!',
                        text: data.error,
                        icon: 'error',
                        confirmButtonText: 'OK'
                    });
                } else {
                    Swal.fire({
                        title: 'Success!',
                        text: data.message,
                        icon: 'success',
                        confirmButtonText: 'OK'
                    });
                }
            })
            .catch(error => {
                Swal.fire({
                    title: 'Error!',
                    text: 'An unexpected error occurred.',
                    icon: 'error',
                    confirmButtonText: 'OK'
                });
            });
        });
    </script>
</body>
</html>
{% endblock %}
