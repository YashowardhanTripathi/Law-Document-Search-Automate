{% extends 'base.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Username</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class ="container">
    <h1>IPC And BNS Finder</h1>
    <br/><br/>
    <li>Please input IPC Section Code</li>
    <br/>
    <form action = "/friends" METHOD = "POST" id="ipc">
        <input type = "text" placeholder="Enter IPC Code" name="IPCCode">
        <input type = "submit" value = "Find IPC Code" class = "btn btn-secondary">
    </form>
    <br/><br/>
    <li>Please input BNS Section Code</li>
    <br/>
    <form action = "/friends" method="POST" id="bns">
      <input type = "text" placeholder="Enter BNS Code" name="BNSCode">
      <input type="submit" value = "Find BNS Code" class = "btn btn-secondary">
    </form>
    <br/><br/>
    </ul>      
    </div>
    <style>
        body    
            {
            background-image: url({{url_for('static',filename= '8057a6909bb7d0d.jpg')}})
            }
    </style>
    <script>
        // Handle form submission
        if (document.getElementById('ipc') && document.getElementById('bns')) {
            document.getElementById('ipc').addEventListener('submit', function(event) {
                event.preventDefault();  // Prevent form from submitting normally
        
                // Prepare form data
                let formData = new FormData(this);
        
                // Send a POST request to the '/friends' endpoint
                fetch('/friends', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())  // Expect JSON response
                .then(data => {
                    // Check if there's data to display
                    if (data.data && data.data.length > 0) {
                        let section = data.data[0].BNS_Section;
                        let heading = data.data[0].BNS_Heading;
                        let ipcSection = data.data[0].IPC_Section;
        
                        // Create a formatted message for the pop-up
                        let message = `
                            <strong>IPC Section:</strong> ${section} <br>
                            <strong>Description:</strong> ${heading} <br>
                            <strong>Punishment:</strong> ${ipcSection}
                        `;
        
                        Swal.fire({
                            title: 'Result:',
                            html: message,  // Use 'html' instead of 'text' to format the message
                            icon: 'info',
                            confirmButtonText: 'OK'
                        });
                    } else {
                        Swal.fire({
                            title: 'Error!',
                            text: 'Section Not Found',
                            icon: 'error',
                            confirmButtonText: 'OK'
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        title: 'Error!',
                        text: error.message || 'An unexpected error occurred.',
                        icon: 'error',
                        confirmButtonText: 'OK'
                    });
                });
            });
            document.getElementById('bns').addEventListener('submit', function(event) {
                event.preventDefault();  // Prevent form from submitting normally
        
                // Prepare form data
                let formData = new FormData(this);
        
                // Send a POST request to the '/friends' endpoint
                fetch('/friends', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())  // Expect JSON response
                .then(data => {
                    // Check if there's data to display
                    if (data.data && data.data.length > 0) {
                        let section = data.data[0].BNS_Section;
                        let heading = data.data[0].BNS_Heading;
                        let ipcSection = data.data[0].IPC_Section;
        
                        // Create a formatted message for the pop-up
                        let message = `
                            <strong>BNS Section:</strong> ${section} <br>
                            <strong>Heading:</strong> ${heading} <br>
                            <strong>IPC Section:</strong> ${ipcSection}
                        `;
        
                        Swal.fire({
                            title: 'Result:',
                            html: message,  // Use 'html' instead of 'text' to format the message
                            icon: 'info',
                            confirmButtonText: 'OK'
                        });
                    } else {
                        Swal.fire({
                            title: 'Error!',
                            text: 'Section Not Found',
                            icon: 'error',
                            confirmButtonText: 'OK'
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        title: 'Error!',
                        text: error.message || 'An unexpected error occurred.',
                        icon: 'error',
                        confirmButtonText: 'OK'
                    });
                });
            });

        }
    </script>
      
    
</body>
</html>
{% endblock %}
